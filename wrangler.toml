name = "drkhaste-academy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# فایل‌های استاتیک (SPA) از پوشه‌ی public سرو می‌شن.
# مسیرهای /api/* همیشه اول به خود Worker می‌رن (برای اجرای کد بک‌اند)،
# بقیه‌ی مسیرها مستقیم از فایل‌های استاتیک سرو می‌شن (سریع و رایگان).
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# همه‌ی ریکوئست‌ها اول به خودِ Worker می‌رن؛ کد index.ts مسیرهای غیر /api رو
# به ASSETS پاس می‌ده. (نسخه‌ی نصب‌شده‌ی wrangler از فیلتر کردن مسیر به‌ازای الگو
# پشتیبانی نمی‌کنه، پس این ساده‌تر و سازگارتره.)
run_worker_first = true

# این مقادیر «حساس نیستن» و می‌تونن همینجا بمونن.
# مقادیر حساس (GITHUB_TOKEN و ADMIN_PASSWORD_HASH و...) به‌صورت secret
# ست می‌شن، نه اینجا — یا با gh actions (seed-secrets.yml) یا از پنل تنظیمات خودِ اپ.
[vars]
GITHUB_BRANCH = "main"
SESSION_MAX_AGE_HOURS = "168"
