name: Seed / Reset Worker Secrets

# این ورک‌فلو رو دستی اجرا کن (تب Actions -> Seed / Reset Worker Secrets -> Run workflow):
#  - بار اول: برای راه‌اندازی اولیه
#  - بعداً: فقط اگه خواستی رمز عبور یا توکن گیت‌هاب رو کامل ریست کنی (نه از پنل تنظیمات)
on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Seed secrets
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_REPO: ${{ secrets.DATA_REPO }}
          GITHUB_BRANCH: ${{ secrets.DATA_REPO_BRANCH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: node scripts/seed-secrets.mjs
